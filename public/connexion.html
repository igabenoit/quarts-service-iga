<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Connexion des gérants · IGA</title><link rel="stylesheet" href="/departments.css"></head><body><main class="workspace"><header class="portal-header"><h1>Connexion des gérants</h1><a href="/">Accès administrateur</a></header><section><p>Utilisez votre identifiant personnel et le mot de passe remis par l’administration.</p><form id="managerLogin"><label>Identifiant<input id="accountLogin" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="100"></label><label>Mot de passe<input id="accountPassword" type="password" autocomplete="current-password" required maxlength="128"></label><button id="connectAccount">Se connecter</button></form><p id="loginStatus" role="alert"></p><p>Mot de passe oublié : demandez à l’administration de le réinitialiser.</p></section></main><script src="/manager-login.js" type="module"></script></body></html>
