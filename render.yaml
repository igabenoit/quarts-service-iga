services:
  - type: web
    name: quarts-service-iga
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quarts-service-iga-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MANAGER_CODE
        sync: false

databases:
  - name: quarts-service-iga-db
    plan: basic-256mb
    databaseName: quarts_service_iga
    user: quarts_service_iga
    ipAllowList: []
